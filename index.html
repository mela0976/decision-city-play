  <meta name="description" content="選一個代理商職能，騎機車在台北信義區過完一個工作天，一天走過九年。">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="決策之城 Decision City">
  <meta property="og:title" content="決策之城 Decision City">
  <meta property="og:description" content="選一個代理商職能，騎機車在台北信義區過完一個工作天，一天走過九年。">
  <meta property="og:url" content="https://mela0976.github.io/decision-city-play/">

  <meta name="twitter:title" content="決策之城 Decision City">
  <meta name="twitter:description" content="選一個代理商職能，騎機車在台北信義區過完一個工作天，一天走過九年。">

  <link rel="icon" type="image/png" href="assets/img/icon.png">
  <link rel="apple-touch-icon" href="assets/img/icon.png">
  <link rel="stylesheet" href="css/base.css?v=7c27097e">
  <link rel="stylesheet" href="css/screens.css?v=7c27097e">
  <link rel="stylesheet" href="css/play.css?v=7c27097e">
  <link rel="stylesheet" href="css/panels.css?v=7c27097e">
  <link rel="stylesheet" href="css/story.css?v=7c27097e">
  <link rel="stylesheet" href="css/side.css?v=7c27097e">
  <link rel="stylesheet" href="css/mobile.css?v=7c27097e">
  <script type="module" src="js/main.js?v=7c27097e"></script>
</head>
<body>
  <main id="stage" data-phase="boot">
    <!-- 引擎可能在 #world 裡加自己的覆蓋層（class 以 dc-engine- 開頭）；遊戲介面都疊在 #world 之上。 -->
    <div id="world">
      <canvas id="city" tabindex="0" aria-label="城市街景。方向鍵或 WASD 移動，空白鍵互動，G 自動前往。"></canvas>
    </div>

    <div id="scene" hidden></div>

    <div id="hud" hidden>
      <div class="hud-id">
        <div class="hud-portrait" id="hud-portrait"></div>
        <div class="hud-who">
          <strong id="hud-role"></strong>
          <time id="hud-clock" aria-label="遊戲時間"></time>
        </div>
      </div>
      <ul class="hud-meters" id="hud-meters"></ul>
      <div class="hud-radio" id="hud-radio">
        <button type="button" class="radio-station" id="radio-station"></button>
        <div class="radio-ticker" id="radio-ticker"><span id="radio-text"></span></div>
      </div>
      <div class="hud-corner">
        <!-- 小地圖外框。放大（M 或點一下）由引擎處理，所以這裡不是按鈕。 -->
        <div class="hud-map" id="hud-map">
          <canvas id="minimap"></canvas>
        </div>
        <button type="button" class="btn btn--small" id="hud-menu"></button>
      </div>
      <div class="hud-task" id="hud-task" hidden>
        <strong id="hud-task-title"></strong>
        <span id="hud-task-hint"></span>
        <span class="hud-timer" id="hud-timer" hidden></span>
        <button type="button" class="btn btn--small hud-autoride" id="hud-autoride" hidden></button>
      </div>
    </div>

    <div id="layer"></div>
    <div id="screen"></div>
    <div id="pause-plate" hidden></div>
    <!-- 下方提示列：左段是現在要做什麼，右段是現在能按什麼 -->
    <p id="hint" hidden><span id="hint-task"></span><span id="hint-keys"></span></p>
    <div id="toasts" role="status" aria-live="polite"></div>
    <div id="boot-plate">載入中</div>
  </main>

  <dialog id="menu" class="sheet" aria-labelledby="menu-title" closedby="any"></dialog>
  <dialog id="proposal" class="sheet sheet--wide" aria-labelledby="proposal-title" closedby="any"></dialog>
  <dialog id="sidelist" class="sheet sheet--wide" aria-labelledby="sidelist-title" closedby="any"></dialog>
  <dialog id="elder" class="sheet sheet--wide" aria-labelledby="elder-title" closedby="any"></dialog>
  <dialog id="manual" class="sheet sheet--wide" aria-labelledby="manual-title" closedby="any"></dialog>
  <dialog id="confirm" class="sheet" aria-labelledby="confirm-title"></dialog>

  <noscript><p class="noscript">這個遊戲需要開啟 JavaScript 才能玩。<br><span lang="en">This game needs JavaScript turned on to play.</span><br><span lang="ja">このゲームを遊ぶにはJavaScriptを有効にしてください。</span></p></noscript>
</body>
</html>
